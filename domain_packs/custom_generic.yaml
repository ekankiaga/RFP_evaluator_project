domain_id: custom_generic
name: Custom / Generic
description: Generic evaluation criteria for a user-defined procurement.
version: 1.0.0
weight_split:
  generic: 100
  domain: 0
generic_criteria:
- name: Technical Capability
  description: Architecture, integrations, scalability, and technical fit.
  weight: 30
  max_score: 10
  what_to_inspect: Solution design, capacity, interoperability, performance evidence, and fit to the stated
    requirements.
- name: Implementation Plan
  description: Timeline, milestones, staffing, and delivery risk.
  weight: 20
  max_score: 10
  what_to_inspect: Named owners, milestones, delivery timeline, staffing, dependencies, testing, training,
    and risk controls.
- name: Commercial Value
  description: Pricing clarity, total cost, and assumptions.
  weight: 20
  max_score: 10
  what_to_inspect: Total cost of ownership, price structure, included services, exclusions, assumptions,
    and additional fees.
- name: Security & Compliance
  description: Controls, certifications, privacy, and auditability.
  weight: 20
  max_score: 10
  what_to_inspect: Security controls, independent audit evidence, privacy practices, incident response,
    and stated limitations.
- name: Support & Experience
  description: Support model and relevant experience.
  weight: 10
  max_score: 10
  what_to_inspect: Support hours, response and resolution targets, escalation, comparable delivery experience,
    and references.
domain_criteria: []
gates: []
domain_prompt_addendum: Use only the supplied criteria and evidence. Do not infer unsupported attributes.
